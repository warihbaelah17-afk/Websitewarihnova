<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>iOS Style UI - Glossy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(135deg, #0f2027, #2c5364, #1c92d2);
    background-size: 300% 300%;
    animation: bg 10s infinite ease;
}

@keyframes bg {
    0% {background-position: 0%}
    50% {background-position: 100%}
    100% {background-position: 0%}
}

.card {
    width: 330px;
    padding: 35px;
    border-radius: 25px;
    text-align: center;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(25px);
    border: 1px solid rgba(255,255,255,0.2);

    color: white;
    box-shadow: 0 15px 50px rgba(0,0,0,0.5);
}

/* HEADING */
h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 10px;

    background: linear-gradient(135deg, #ffffff, #a8e6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow: 0 0 10px rgba(255,255,255,0.3);
}

/* PARAGRAF */
p {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 20px;
}

/* BUTTON */
.menu-btn {
    position: relative;
    display: block;
    width: 100%;
    margin: 12px 0;
    padding: 13px;
    border-radius: 999px;
    border: none;
    overflow: hidden;

    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;

    cursor: pointer;
    color: white;

    background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
    backdrop-filter: blur(10px);

    box-shadow:
        0 5px 15px rgba(0,0,0,0.3),
        inset 0 1px 2px rgba(255,255,255,0.6),
        inset 0 -2px 5px rgba(0,0,0,0.2);

    transition: 0.3s;
}

.menu-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
    transition: 0.6s;
}

.menu-btn:hover::before {
    left: 100%;
}

.menu-btn:hover {
    transform: scale(1.05);
    box-shadow:
        0 10px 30px rgba(0,0,0,0.5),
        0 0 15px rgba(0, 200, 255, 0.6);
}

.menu-btn:active {
    transform: scale(0.95);
}

/* FOOTER */
.footer {
    margin-top: 15px;
    font-size: 12px;
    opacity: 0.6;
    font-family: 'Inter', sans-serif;
}

/* ===== NAVIGASI KEMBALI ===== */
.back-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;

    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;

    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    color: white;

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);

    box-shadow:
        0 5px 15px rgba(0,0,0,0.4),
        inset 0 1px 2px rgba(255,255,255,0.5);

    transition: 0.3s;
}

.back-btn:hover {
    transform: scale(1.05);
    box-shadow:
        0 8px 20px rgba(0,0,0,0.6),
        0 0 10px rgba(0,200,255,0.6);
}
</style>

<script>
function tampilNama() {
    alert("Nama: Warih Nova Dwi Hasta");
}

function tampilSekolah() {
    alert("Sekolah: SMKN 1 Purwokerto");
}

function tampilJurusan() {
    alert("Jurusan: Teknik Jaringan Komputer Dan Telekomunikasi");
}

function tampilAlamat() {
    alert("Alamat: Karangnanas RT 2 RW 4");
}
</script>

</head>

<body>

<div class="card">
    <h1>Bio Data Warih</h1>
    <p>Klik salah satu untuk menampilkan data</p>

    <button class="menu-btn" onclick="tampilNama()">NAMA</button>
    <button class="menu-btn" onclick="tampilSekolah()">SEKOLAH</button>
    <button class="menu-btn" onclick="tampilJurusan()">JURUSAN</button>
    <button class="menu-btn" onclick="tampilAlamat()">ALAMAT</button>

    <div class="footer">
        by Warih Nova Dwi Hasta ✨
    </div>
</div>

<!-- TOMBOL KEMBALI -->
<a href="indexjava.html" class="back-btn">← Kembali</a>

</body>
</html>
