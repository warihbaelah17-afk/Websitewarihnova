<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background: radial-gradient(circle at top, #5aa9ff, #142c4c);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ===== SHOPPING PARTICLES ===== */
.particles span{
    position:absolute;
    font-size:16px;
    opacity:0.35;
    filter: drop-shadow(0 0 6px rgba(180,220,255,0.8));
    animation: float linear infinite;
}

@keyframes float{
    from{
        transform: translateY(110vh) translateX(0) scale(0.8);
        opacity:0;
    }
    to{
        transform: translateY(-20vh) translateX(40px) scale(1);
        opacity:0.5;
    }
}

/* ===== LOGIN CARD ===== */
.login-box{
    position:relative;
    width:360px;
    padding:40px;
    border-radius:20px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(18px);
    border:1px solid rgba(255,255,255,0.35);
    box-shadow:
        0 0 45px rgba(160,200,255,0.9),
        inset 0 0 25px rgba(255,255,255,0.25);
    z-index:2;
}

.login-box h2{
    text-align:center;
    color:#ffffff;
    margin-bottom:30px;
    letter-spacing:2px;
}

/* INPUT */
label{
    font-size:13px;
    color:#eef4ff;
}

input{
    width:100%;
    padding:12px;
    margin:6px 0 20px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.25);
    color:#fff;
    outline:none;
}

input::placeholder{
    color:#e0ecff;
}

input:focus{
    box-shadow:0 0 18px rgba(200,230,255,1);
    border-color:#ffffff;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:14px;
    background: linear-gradient(135deg,#6fb1ff,#ffffff);
    color:#0f1f3a;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 0 35px rgba(200,230,255,1);
    transition:0.3s;
}

button:hover{
    transform: translateY(-2px);
    box-shadow:0 0 50px rgba(220,240,255,1);
}

#pesan{
    margin-top:18px;
    text-align:center;
    font-size:14px;
}

/* ===== NAVIGASI KEMBALI ===== */
.back-btn{
    position:fixed;
    bottom:20px;
    left:20px;

    padding:10px 18px;
    border-radius:999px;
    text-decoration:none;

    font-size:13px;
    color:#fff;

    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(12px);

    box-shadow:
        0 5px 15px rgba(0,0,0,0.4),
        inset 0 1px 2px rgba(255,255,255,0.6);

    transition:0.3s;
}

.back-btn:hover{
    transform: scale(1.05);
    box-shadow:
        0 8px 25px rgba(0,0,0,0.6),
        0 0 10px rgba(180,220,255,0.8);
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="login-box">
    <h2>LOGIN</h2>

    <label>Username</label>
    <input type="text" id="username" placeholder="Masukkan username">

    <label>Password</label>
    <input type="password" id="password" placeholder="Masukkan password">

    <button onclick="login()">Login</button>

    <p id="pesan"></p>
</div>

<!-- TOMBOL KEMBALI -->
<a href="indexjava.html" class="back-btn">← Kembali</a>

<script>
const userBenar = "warih";
const passBenar = "12345678";

function login(){
    let pesan = document.getElementById("pesan");
    if(username.value !== userBenar){
        pesan.style.color="#ffd6d6";
        pesan.innerHTML="Username salah";
    }else if(password.value !== passBenar){
        pesan.style.color="#ffd6d6";
        pesan.innerHTML="Password salah";
    }else{
        pesan.style.color="#d4ffe8";
        pesan.innerHTML="Login berhasil...";
        setTimeout(()=>window.location.href="menu.html",900);
    }
}

/* PARTICLES */
const icons = ["🛒","🛍️","📦","💳","🏷️"];
const container = document.getElementById("particles");

for(let i=0;i<45;i++){
    const p = document.createElement("span");
    p.innerText = icons[Math.floor(Math.random()*icons.length)];
    p.style.left = Math.random()*100 + "vw";
    p.style.animationDuration = (Math.random()*15 + 10) + "s";
    p.style.animationDelay = Math.random()*10 + "s";
    container.appendChild(p);
}
</script>

</body>
</html>
