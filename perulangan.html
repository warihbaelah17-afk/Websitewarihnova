<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program Cek Tabungan</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background: #0b1220;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px 100px;
}

/* Background glow */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 20%, rgba(56,189,248,0.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(99,102,241,0.15), transparent 40%);
    z-index: -1;
}

/* Container */
.container {
    width: 100%;
    max-width: 600px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(30px);
    border-radius: 20px;
    padding: 30px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

/* Header */
h1 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #38bdf8, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

p {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 25px;
}

/* Output card */
.output-box {
    background: rgba(15, 23, 42, 0.55);
    border-radius: 14px;
    padding: 18px;
    border: 1px solid rgba(255,255,255,0.05);
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
}

/* Glossy smooth */
.output-box::before {
    content: "";
    position: absolute;
    inset: -50%;
    background: linear-gradient(
        120deg,
        transparent 30%,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.18),
        transparent 70%
    );
    transform: translateX(-120%) rotate(20deg);
    filter: blur(8px);
    opacity: 0;
    animation: gloss 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

@keyframes gloss {
    0% { transform: translateX(-120%) rotate(20deg); opacity: 0; }
    20% { opacity: 0.25; }
    50% { transform: translateX(120%) rotate(20deg); opacity: 0.35; }
    80% { opacity: 0.1; }
    100% { transform: translateX(120%) rotate(20deg); opacity: 0; }
}

/* Text */
.output-box span {
    color: #38bdf8;
    font-weight: 600;
}

.highlight { color: #34d399; }
.error { color: #f87171; }

/* ===== NAV KIRI BAWAH ===== */
.btn-kembali {
    position: fixed;
    bottom: 25px;
    left: 25px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #38bdf8;
    padding: 12px 20px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.25s;
}

.btn-kembali:hover {
    transform: scale(1.08);
    background: #38bdf8;
    color: #0b1220;
}

.btn-kembali:active {
    transform: scale(0.92);
}
</style>
</head>

<body>

<!-- ✅ NAVIGASI KIRI BAWAH -->
<a href="index.html" class="btn-kembali">⬅ Kembali</a>

<div class="container">
    <h1>💰 Program Cek Tabungan</h1>
    <p>Hasil akan ditampilkan secara interaktif</p>

    <div id="output"></div>
</div>

<script>
// INPUT
let nama = prompt("Masukkan nama kamu:");
let target = Number(prompt("Masukkan target jumlah tabungan (angka):"));
let tabunganHarian = Number(prompt("Berapa yang bisa kamu tabung per hari?"));

// OUTPUT FUNCTION
const cetakHasil = (teks) => {
    const wadah = document.getElementById("output");
    wadah.innerHTML += `<div class="output-box">${teks}</div>`;
};

// LOGIKA
let totalHari = target / tabunganHarian;

cetakHasil(`Halo, <span>${nama}</span>! 👋`);

if (tabunganHarian <= 0) {
    cetakHasil(`<span class="error">Tabungan harian harus lebih dari 0.</span>`);
} else {
    cetakHasil(`Untuk mencapai <span>Rp${target}</span>, kamu butuh <span>${Math.ceil(totalHari)} hari</span>.`);

    cetakHasil(`<span>📊 Simulasi 5 hari pertama</span>`);

    for (let i = 1; i <= 5; i++) {
        let progres = i * tabunganHarian;
        cetakHasil(`Hari ke-${i}: <span class="highlight">Rp${progres}</span>`);
    }
}

console.log("Program selesai dijalankan.");
</script>

</body>
</html>
