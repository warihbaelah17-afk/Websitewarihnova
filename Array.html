<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Array Sekolah - Pro UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Font Premium -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #4facfe, #00f2fe, #667eea, #764ba2);
    background-size: 300% 300%;
    animation: gradientMove 12s ease infinite;
    color: #1c1c1e;
}

/* animasi gradient */
@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* CONTAINER */
.container {
    max-width: 700px;
    margin: 70px auto;
    padding: 25px;
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 35px;
}

.header h2 {
    font-size: 30px;
    font-weight: 700;
    color: white;
    letter-spacing: -0.5px;
}

.header p {
    font-size: 15px;
    color: rgba(255,255,255,0.8);
    margin-top: 8px;
}

/* CARD */
.box {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border-radius: 20px;
    padding: 20px;
    margin-bottom: 18px;

    border: 1px solid rgba(255,255,255,0.3);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.15),
        inset 0 1px 1px rgba(255,255,255,0.4);

    transition: 0.3s;
}

.box:hover {
    transform: translateY(-4px) scale(1.02);
}

/* teks */
.box strong {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 6px;
    opacity: 0.9;
}

.box span {
    font-size: 16px;
    font-weight: 500;
    color: #ffffff;
}

/* FLOAT BUTTON */
.floating-nav {
    position: fixed;
    bottom: 25px;
    left: 25px;
}

.floating-nav a {
    text-decoration: none;
    padding: 13px 18px;
    border-radius: 999px;

    background: linear-gradient(135deg, #ffffff, #dbeafe);
    color: #2563eb;
    font-weight: 600;
    font-size: 14px;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.2);

    transition: 0.25s;
}

.floating-nav a:hover {
    transform: scale(1.08);
}

/* FOOTER */
footer {
    text-align: center;
    margin-top: 35px;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
}
</style>
</head>

<body>

<div class="floating-nav">
    <a href="index.html">⬅ Kembali</a>
</div>

<div class="container">

    <div class="header">
        <h2>Manipulasi Array Sekolah</h2>
        <p>Visualisasi interaktif perubahan data array</p>
    </div>

    <div id="output"></div>

    <footer>
        Warih Nova Dwi Hasta • XI TJKT 1
    </footer>

</div>

<script>
const output = document.getElementById("output");

function tampilkanArray(judul, array) {
    output.innerHTML += `
        <div class="box">
            <strong>${judul}</strong>
            <span>${array.join(", ")}</span>
        </div>
    `;
}

let namasekolah = ["sd", "smp", "smk", "universitas"];
tampilkanArray("Array Awal", namasekolah);

namasekolah[0] = "sekolah idaman";
namasekolah[1] = "sekolah nyaman";
tampilkanArray("Setelah Diubah", namasekolah);

namasekolah.splice(0, 1);
namasekolah.splice(namasekolah.indexOf("universitas"), 1);
tampilkanArray("Setelah Dihapus", namasekolah);
</script>

</body>
</html>
